<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07020c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Chalet">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" href="img/icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Le Chalet des Secrets</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head><body>
<title>Le Chalet des Secrets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;1,800;1,900&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed animated stage stays alive behind every screen; screens are glass panels over the night scene */
:root{
  --night:#07020c;
  --neon:#ff2e88;
  --neon-soft:#ff7ab8;
  --ice:#fff3f8;
  --mist:#d9b3c8;
  --glass:rgba(30,4,22,.5);
  --glass-strong:rgba(18,2,14,.82);
  --blue:#3d7bff;
  --ok:#5ef0b4;
  --f-display:"Exo 2","Arial Black",system-ui,sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ice);overflow:hidden;font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#backdrop{position:absolute;inset:-40px;background:url(img/bg.webp) center/cover;filter:blur(30px) brightness(.45) saturate(1.2);opacity:0;transition:opacity 2s}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;transition:filter 1s ease}
.dim #stage{filter:brightness(.42) blur(2px) saturate(1.1)}
.layer{position:absolute;will-change:transform,opacity}
.layer img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
#bgL{inset:-4%}
#bgL img{width:100%;height:100%;object-fit:cover}
#chaletL{left:7.5%;top:23.9%;width:87.7%}
#chaletL img{-webkit-mask-image:linear-gradient(#000 74%,transparent 96%);mask-image:linear-gradient(#000 74%,transparent 96%)}
#eyeL{left:29%;top:39%;width:42%}
#logoL{left:11%;top:48.4%;width:78%}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#fff 0,rgba(255,120,190,.85) 25%,transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(5,0,10,.75) 100%)}

.anim{opacity:0}
.go #bgA{animation:bgIn 3.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bgIn{0%{opacity:0;transform:scale(1.35);filter:brightness(.2) blur(6px)}100%{opacity:1;transform:scale(1);filter:none}}
.go #chaletA{animation:chaletIn 2.2s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
@keyframes chaletIn{0%{opacity:0;transform:translateY(14%) scale(.92);filter:blur(10px) brightness(.1)}55%{filter:blur(0) brightness(.35)}70%{filter:brightness(1.25)}76%{filter:brightness(.55)}84%{filter:brightness(1.15)}100%{opacity:1;transform:none;filter:brightness(1)}}
.go #chaletA img{animation:windows 5s ease-in-out 3.6s infinite}
@keyframes windows{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12) saturate(1.1)}}
.go #eyeA{animation:eyeOpen 1s cubic-bezier(.3,1.5,.5,1) 2.7s forwards;transform-origin:50% 55%}
@keyframes eyeOpen{0%{opacity:0;transform:scale(.6,.02)}40%{opacity:1;transform:scale(1.08,.06)}100%{opacity:1;transform:scale(1,1)}}
#eyeA img{transform-origin:50% 55%}
.blink #eyeA img,.blink .sealEye{animation:blink .32s ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(1)}45%,55%{transform:scaleY(.05)}}
.go #eyeL{animation:stare 4s ease-in-out 3.8s infinite}
@keyframes stare{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 18px rgba(61,123,255,.55))}}
.go #logoA{animation:slam .9s cubic-bezier(.2,1.6,.4,1) 3.5s forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(-4deg);filter:blur(14px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
.go #logoA img{animation:pulse 3.2s ease-in-out 4.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
#shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.9) 48%,rgba(255,200,230,.5) 52%,transparent 64%);background-size:250% 100%;background-position:120% 0;-webkit-mask:url(img/logo.webp) center/100% 100% no-repeat;mask:url(img/logo.webp) center/100% 100% no-repeat;mix-blend-mode:screen}
.go #shine{animation:shine 1.3s ease-in-out 4.1s,shine 1.3s ease-in-out 9s infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-60% 0}}

/* ---------- shared UI ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:screenIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.miniLogo{height:44px;width:auto;filter:drop-shadow(0 0 10px rgba(255,46,136,.5))}
.back{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--ice);background:var(--glass);border:1px solid rgba(255,122,184,.4);border-radius:999px;padding:9px 14px;cursor:pointer}
.eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:var(--neon-soft);margin:0}
h1,h2{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;text-shadow:0 0 18px rgba(255,46,136,.6)}
h1{font-size:clamp(26px,7.5vw,38px);line-height:1.02}
h2{font-size:22px}
p{line-height:1.5}
.lead{color:var(--mist);font-size:15px;margin:6px 0 0;max-width:34em}
.btn{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:999px;padding:16px 22px;cursor:pointer;color:var(--ice);transition:transform .15s ease,box-shadow .2s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.primary{background:linear-gradient(180deg,#ff8fc4 0%,var(--neon) 45%,#b0105a 100%);box-shadow:0 0 0 2px rgba(255,255,255,.55) inset,0 0 28px rgba(255,46,136,.75),0 10px 30px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(120,0,50,.6)}
.secondary{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1.5px var(--neon-soft) inset,0 0 18px rgba(255,46,136,.35);font-size:16px}
.panel{background:var(--glass-strong);border:1px solid rgba(255,122,184,.35);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 30px rgba(255,46,136,.18)}

/* ---------- intro CTA ---------- */
#cta{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.ready #cta{opacity:1;transform:none;pointer-events:auto}
.dim #cta{opacity:0!important;pointer-events:none!important}
#date{font-family:var(--f-display);font-weight:700;letter-spacing:.32em;font-size:13px;text-transform:uppercase;color:var(--ice);text-shadow:0 0 12px var(--neon);margin:0 0 4px}
.btns{display:flex;flex-direction:column;gap:10px;width:min(100%,340px)}
#replay{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ice);background:var(--glass);border:1px solid rgba(255,122,184,.4);border-radius:999px;padding:7px 12px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
.ready #replay{opacity:.8;pointer-events:auto}
.dim #replay{opacity:0!important;pointer-events:none!important}

/* ---------- pick carousel ---------- */
#pick .head{margin:14px 0 0}
.rail{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px calc(50% - 31vw) 20px;margin:0 -18px;scrollbar-width:none;perspective:900px;flex:1;align-items:center;min-height:0}
.rail::-webkit-scrollbar{display:none}
.slot{flex:0 0 62vw;max-width:310px;scroll-snap-align:center;display:flex;justify-content:center}
.card{position:relative;width:100%;aspect-ratio:941/1672;border:0;padding:0;background:none;cursor:pointer;border-radius:18px;transform-style:preserve-3d;transition:transform .12s linear,filter .2s}
.card img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 24px rgba(255,46,136,.35)}
.tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(10,0,8,.8);border:1px solid var(--ok);color:var(--ok)}
.hint{font-size:13px;color:var(--mist);text-align:center;margin:0 0 6px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .25s}
.dots i.on{background:var(--neon);width:18px;border-radius:4px;box-shadow:0 0 8px var(--neon)}

/* ---------- code sheet ---------- */
#sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,0,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheetIn{width:min(100%,460px);box-sizing:border-box;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:var(--glass-strong);border:1px solid rgba(255,122,184,.4);border-bottom:0;display:flex;flex-direction:column;gap:14px;animation:up .45s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.who{display:flex;gap:14px;align-items:center}
.who img{width:64px;aspect-ratio:941/1672;object-fit:cover;border-radius:10px;box-shadow:0 0 16px rgba(255,46,136,.5)}
.who b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;display:block}
.who span{font-size:13px;color:var(--mist)}
#code{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.5em;text-align:center;text-transform:uppercase;padding:14px 0 14px .5em;border-radius:16px;border:1.5px solid var(--neon-soft);background:rgba(0,0,0,.45);color:var(--ice);width:100%;box-sizing:border-box}
#code::placeholder{color:rgba(255,255,255,.2)}
.err{color:#ff8a9a;font-size:14px;min-height:20px;margin:0;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- form ---------- */
#form{gap:16px}
.fhead{display:flex;gap:14px;align-items:center;margin-top:8px}
.fhead img{width:72px;aspect-ratio:941/1672;object-fit:cover;border-radius:12px;box-shadow:0 0 18px rgba(255,46,136,.5)}
label.big{display:block;font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;font-size:16px;margin-bottom:8px}
.help{font-size:13px;color:var(--mist);margin:0 0 10px}
textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;font:inherit;font-size:16px;line-height:1.45;color:var(--ice);background:rgba(0,0,0,.4);border:1.5px solid rgba(255,122,184,.45);border-radius:16px;padding:14px}
.count{font-size:12px;color:var(--mist);text-align:right;margin-top:6px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;color:var(--ice);background:rgba(0,0,0,.35);border:1.5px solid rgba(255,122,184,.4);border-radius:999px;padding:10px 14px;cursor:pointer;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--neon);border-color:#fff;box-shadow:0 0 16px rgba(255,46,136,.7)}
#autre{margin-top:10px;width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ice);background:rgba(0,0,0,.4);border:1.5px solid rgba(255,122,184,.45);border-radius:14px;padding:12px 14px}
.anon{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mist);margin:0}
.anon img{width:34px;flex:none;margin-top:2px}

/* ---------- sealed ---------- */
#sealed{align-items:center;justify-content:center;text-align:center;gap:18px;overflow:hidden}
.paper{max-width:300px;padding:18px;border-radius:16px;background:rgba(255,240,248,.95);color:#3a0620;font-size:16px;line-height:1.4;font-style:italic;box-shadow:0 0 40px rgba(255,46,136,.6);animation:fold 1.4s cubic-bezier(.6,0,.4,1) .4s forwards}
@keyframes fold{0%{transform:none;opacity:1;filter:none}60%{transform:scale(.35) rotate(8deg);filter:blur(2px) brightness(1.5)}100%{transform:scale(0) rotate(20deg);opacity:0;filter:blur(8px) brightness(3)}}
.sealEye{width:min(70vw,300px);opacity:0;animation:eyeOpen 1s cubic-bezier(.3,1.5,.5,1) 1.7s forwards}
.stamp{opacity:0;animation:slam .7s cubic-bezier(.2,1.6,.4,1) 2.5s forwards}
.stamp h1{font-size:clamp(30px,10vw,46px)}
.later{opacity:0;animation:fade .6s ease 3.3s forwards;display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- mission card (flip) ---------- */
.flip{width:min(78vw,320px);aspect-ratio:3/4;perspective:1200px;cursor:pointer;border:0;padding:0;background:none;color:inherit}
.flipIn{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.flip.open .flipIn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;box-sizing:border-box;border:2px solid var(--neon-soft);box-shadow:0 0 34px rgba(255,46,136,.55)}
.front{background:radial-gradient(circle at 50% 35%,#4a0a2e,#12020c 70%)}
.front img{width:70%}
.front small{font-size:13px;color:var(--mist)}
.backF{transform:rotateY(180deg);background:linear-gradient(160deg,#2a0518,#12020c)}
.backF p{font-size:19px;font-weight:500;line-height:1.4;margin:0;text-wrap:balance}
.backF .eyebrow{color:var(--neon)}
.test{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px}

/* ---------- espace ---------- */
#space{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));gap:14px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass-strong);border-top:1px solid rgba(255,122,184,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{font:inherit;font-size:12px;font-weight:500;color:var(--mist);background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
.tab span{font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--ice);background:rgba(255,46,136,.2);box-shadow:0 0 0 1px rgba(255,122,184,.4) inset}
.pane{display:flex;flex-direction:column;gap:14px;animation:screenIn .4s}
.mycard{width:min(70vw,300px);align-self:center;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px rgba(255,46,136,.4)}
.kv{display:flex;flex-direction:column;gap:6px}
.kv .eyebrow{font-size:11px}
.blurred{filter:blur(7px);user-select:none}
.secretTxt{font-size:17px;line-height:1.45;margin:0;transition:filter .3s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.smallBtn{font:inherit;font-size:14px;font-weight:600;color:var(--ice);background:rgba(0,0,0,.35);border:1.5px solid rgba(255,122,184,.45);border-radius:999px;padding:9px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gcard{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:941/1672;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.gcard img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.gcard.waiting img{filter:grayscale(.85) brightness(.45)}
.wait{position:absolute;inset:auto 8px 42%;text-align:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.15;color:var(--ice);text-shadow:0 0 10px var(--neon)}
.wait small{display:block;font-family:var(--f-body);font-style:normal;font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--mist);margin-top:6px;animation:dots 1.4s infinite}
@keyframes dots{50%{opacity:.3}}
.inOk{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;background:rgba(10,0,8,.8);border:1px solid var(--ok);color:var(--ok)}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),#ffb3d6);border-radius:99px;box-shadow:0 0 12px var(--neon);transition:width .8s}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:28px;font-style:italic;font-weight:900}
.note{font-size:12px;color:var(--mist);text-align:center;margin:0}
#toast{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass-strong);border:1px solid var(--neon-soft);border-radius:14px;padding:12px 16px;font-size:14px;text-align:center;max-width:86%;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#toast.on{opacity:1}

/* ---------- stories (Le Jeu) ---------- */
#stories{position:absolute;inset:0;z-index:15;background:linear-gradient(180deg,rgba(7,2,12,.78) 0%,rgba(18,2,14,.86) 45%,rgba(7,2,12,.95) 100%),url(img/bg.webp) center/cover,#07020c;display:flex;flex-direction:column;animation:fade .35s}
.bars{display:flex;gap:4px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ice);box-shadow:0 0 8px var(--neon);transition:width .35s}
.bars i.done b{width:100%}
.sTop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0}
.sTop img{height:36px}
.sClose{font:inherit;font-size:22px;line-height:1;color:var(--ice);background:none;border:0;padding:6px 8px;cursor:pointer}
.slide{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 120px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.slide > *{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide > *:nth-child(1){animation-delay:.05s}.slide > *:nth-child(2){animation-delay:.15s}.slide > *:nth-child(3){animation-delay:.28s}.slide > *:nth-child(4){animation-delay:.4s}.slide > *:nth-child(5){animation-delay:.52s}.slide > *:nth-child(6){animation-delay:.64s}.slide > *:nth-child(7){animation-delay:.76s}.slide > *:nth-child(8){animation-delay:.88s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.slide h1{font-size:clamp(28px,8.5vw,42px)}
.mega{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(64px,22vw,120px);line-height:.9;color:var(--neon);text-shadow:0 0 30px rgba(255,46,136,.8);margin:6px 0;animation:megaSlam .8s cubic-bezier(.2,1.6,.4,1) .3s forwards!important}

.step{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;padding:14px 16px;border-radius:16px;background:rgba(60,8,40,.55);border:1px solid rgba(255,122,184,.3)}
.step b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:24px;color:var(--neon);grid-row:span 2}
.step strong{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.step span{font-size:14px;color:var(--mist);line-height:1.45}
.callout{padding:14px 16px;border-radius:16px;background:rgba(255,46,136,.16);border:1px solid var(--neon-soft);font-size:15px;line-height:1.5}
.refs2{display:flex;flex-direction:column;gap:16px}
.ref{padding:14px;border-radius:18px;background:rgba(30,4,22,.72);border:1px solid rgba(255,122,184,.35);box-shadow:0 0 22px rgba(255,46,136,.15);display:flex;flex-direction:column;gap:8px}
.ref h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 12px rgba(255,46,136,.6)}
.ref p{margin:0;font-size:14px;color:var(--mist);line-height:1.45}
.refPics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px;align-items:start}
.refPics figure{margin:0;position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--neon-soft);box-shadow:0 0 16px rgba(255,46,136,.45)}
.refPics figure:nth-child(odd){transform:rotate(-1.5deg)}.refPics figure:nth-child(even){transform:rotate(1.5deg)}
.refPics figure.wide{grid-column:span 2;transform:rotate(-.8deg)}
.refPics img{display:block;width:100%;height:auto}
.refPics figure:not(.wide):not(:only-child) img{aspect-ratio:2/3;object-fit:cover;object-position:50% 12%}
.refPics figure:only-child:not(.wide){grid-column:span 2;width:62%;justify-self:center}
#stories .tapL,#stories .tapR{display:none}
.slide{touch-action:pan-y;overscroll-behavior:contain}
.refPics figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(7,2,12,.9));font-family:var(--f-display);font-weight:800;font-style:italic;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.refs{display:flex;flex-direction:column;gap:8px}
.refs div{padding:10px 14px;border-radius:14px;background:rgba(60,8,40,.55);border:1px solid rgba(255,122,184,.3)}
.refs b{display:block;font-family:var(--f-display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.03em}
.refs span{font-size:13px;color:var(--mist);line-height:1.4}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.look{margin:0}
.look img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;display:block;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.look figcaption{margin-top:6px}
.look figcaption b{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;text-transform:uppercase;color:var(--neon-soft);letter-spacing:.04em}
.look figcaption span{font-size:12px;color:var(--mist)}
.ex{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:start}
.ex img{width:100%;border-radius:14px;box-shadow:0 0 20px rgba(255,46,136,.4)}
.ex p{margin:0 0 10px;font-size:14px}
.fields{display:flex;flex-direction:column}
.fields div{padding:12px 0;border-bottom:1px solid rgba(255,122,184,.3)}
.fields b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon-soft);margin-bottom:4px}
.fields span{font-size:15px;color:var(--mist)}
.draft{align-self:flex-start;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);border:1px dashed rgba(255,255,255,.35);border-radius:999px;padding:4px 10px}
.tapL,.tapR{position:absolute;top:90px;bottom:110px;width:32%;z-index:1;background:none;border:0;cursor:pointer}
.tapL{left:0}.tapR{right:0}
.sNav{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:10px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(7,2,12,.95) 40%)}
.sNav .btn{flex:1;padding:14px 16px;font-size:16px}
.sNav .btn.secondary{flex:0 0 auto}
#gameLink{font:inherit;font-size:14px;font-weight:500;color:var(--ice);background:none;border:0;text-decoration:underline;text-underline-offset:4px;opacity:.85;cursor:pointer;padding:6px}

/* ---------- form steps ---------- */
.stepper{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.stepper i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.stepper i.on{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.fld label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon-soft);font-weight:600;margin-bottom:6px}
.fld input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ice);background:rgba(0,0,0,.4);border:1.5px solid rgba(255,122,184,.45);border-radius:14px;padding:12px 14px}
.pubNote{font-size:13px;color:var(--mist);margin:0}

/* ---------- public fiche modal ---------- */
#fiche{position:absolute;inset:0;z-index:12;background:rgba(5,0,8,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;animation:fade .3s}
.ficheIn{max-width:460px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ficheIn .mycard{width:min(62vw,260px);animation:megaSlam .6s cubic-bezier(.2,1.4,.4,1)}
.quote{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;text-align:center;margin:0;text-wrap:balance;text-shadow:0 0 14px rgba(255,46,136,.7)}
.gcard{cursor:default}
button.gcard{border:0;padding:0;cursor:pointer;background:none;color:inherit;font:inherit;text-align:left}

/* ---------- drone dive + chalet tour ---------- */
.diving #cta,.diving #replay{opacity:0!important;pointer-events:none!important;transition:opacity .3s}
.diving #logoA{animation:flyOut .7s cubic-bezier(.5,0,.8,.3) forwards!important}
.diving #eyeA{animation:flyOut .6s cubic-bezier(.5,0,.8,.3) .08s forwards!important}
@keyframes flyOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-40%) scale(1.6);filter:blur(8px)}}
#tour{position:absolute;inset:0;z-index:14;background:var(--night);overflow:hidden;animation:fade .25s}
.room{position:absolute;inset:0}
.room .decor{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;animation:decorIn 1.5s cubic-bezier(.2,.7,.2,1) forwards,drift 9s ease-in-out 1.5s infinite alternate}
.enter .room .decor{animation:decorEnter 1.6s cubic-bezier(.15,.8,.2,1) forwards,drift 9s ease-in-out 1.6s infinite alternate}
@keyframes decorIn{from{transform:scale(1.28);filter:blur(10px) brightness(.25)}to{transform:scale(1.06);filter:none}}
@keyframes decorEnter{from{transform:scale(1.7);filter:blur(14px) brightness(2.2)}to{transform:scale(1.06);filter:none}}
@keyframes drift{from{transform:scale(1.06) translateX(0)}to{transform:scale(1.12) translateX(-2%)}}
.room .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,2,12,.55) 0%,transparent 28%,transparent 48%,rgba(7,2,12,.85) 100%)}
.room .title{position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 18px;text-align:center}
.room .rlogo{width:min(88vw,420px);opacity:0;animation:slam .8s cubic-bezier(.2,1.6,.4,1) 1.1s forwards;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
.chrome{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:clamp(46px,15vw,78px);line-height:.9;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff 0%,#f6d6ec 38%,#b46a9c 52%,#fff2fa 64%,#e7b3d4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1.5px rgba(255,90,170,.9);filter:drop-shadow(0 0 14px rgba(255,46,136,.9)) drop-shadow(0 4px 0 rgba(90,0,40,.8));opacity:0;animation:slam .8s cubic-bezier(.2,1.6,.4,1) 1.1s forwards;padding:0 .08em}
.room .sub{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice);text-shadow:0 0 12px var(--neon);margin:0;opacity:0;animation:fade .6s ease 1.7s forwards}
.room .hello{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;opacity:0;animation:fade .6s ease .6s forwards}
.steam{position:absolute;left:0;right:0;bottom:22%;height:45%;pointer-events:none;overflow:hidden}
.steam i{position:absolute;bottom:-20%;width:40%;height:60%;border-radius:50%;background:radial-gradient(circle,rgba(255,220,240,.35),transparent 65%);filter:blur(14px);animation:steam 6s linear infinite}
.steam i:nth-child(2){left:30%;animation-delay:-2s;width:50%}.steam i:nth-child(3){left:60%;animation-delay:-4s}
@keyframes steam{from{transform:translateY(0) scale(.8);opacity:0}25%{opacity:1}to{transform:translateY(-90%) scale(1.5);opacity:0}}
.tourTop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
.tourTop img{height:40px}
.tourNav{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px))}
.tourNav .row{width:min(100%,380px);display:flex;gap:10px}
.tourNav .btn{flex:1;padding:14px 16px;font-size:16px}
.tourNav .btn.secondary{flex:0 0 auto}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.roomCard{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:3/4;cursor:pointer;background:none;color:var(--ice);box-shadow:0 10px 24px rgba(0,0,0,.5)}

#space{z-index:1}

.tabs{grid-template-columns:repeat(5,1fr)!important;padding-left:4px!important;padding-right:4px!important}

/* ---------- jeu bullets + infos ---------- */
.tabs{grid-template-columns:repeat(5,1fr)!important;z-index:2}

<script>
(function(){

    {id:'vince',  name:'Vince',  f:false, h:'43c8b6e852f3749039622179ad6090e3b8dfc3d04e061dfeac037f949e5ea66d', mission:"Convaincs quelqu'un d'échanger un accessoire avec toi pour le reste de la soirée."},

    {id:'caro',   name:'Caro',   f:true,  h:'b86c86f8d2bd2c149095061da72d26637e62417c3077bfafbecbde23a1de2ba2', mission:"Fais croire à 2 personnes que tu as un deuxième secret."},
    {id:'ricky',  name:'Ricky',  f:false, h:'a7af398dcc4fc9854fbf644ad9993242b40acf87ff53c3e845c6a6f1909a51e9', mission:"Fais applaudir tout le salon au moins une fois sans dire pourquoi."},
    {id:'juju',   name:'Juju',   f:true,  v:2,  h:'1b61625418b773251f70fa150389de4bdf523fc092136473cd802383947976f9', mission:"Obtiens un indice de quelqu'un sans jamais payer son prix."},
    {id:'laeti',  name:'Laëti',  f:true,  h:'ed6a0ddd65483373dc73339c510260714d9e26aa8bbba6a5242ab761fc966e24', mission:"Fais porter un toast en ton honneur par 3 personnes différentes avant minuit."},
    {id:'sam',    name:'Sam',    f:false, h:'cfe83eb1c5b5408228ebdaa10729ef38aa10220b769ef628108f714f229eb7e1', mission:"Fais trinquer tout le monde à ta santé au moins une fois dans la soirée."},
    {id:'estelle',name:'Estelle',f:true,  h:'f627928005a7e3e44835142684af215137bf60b359d45e83570c3c8ad53c3091', mission:"Fais avouer à quelqu'un son pire souvenir de soirée."},
    {id:'marie',  name:'Marie',  f:true,  h:'f415d818c2e67fb7e2e7cc43418065ac49af4c086f2043b63f202e0855c1863d', mission:"Fais chanter le refrain d'une chanson à tout le salon."}
  ];
  const MISSIONS_TEST=true;
  const PRIX=['🥃 Un shot','🎭 Un gage','👕 Un vêtement en moins','💃 Une danse','🎤 Une chanson'];
  const byId=Object.fromEntries(CANDIDATS.map(c=>[c.id,c]));
  const img=c=>'img/c-'+c.id+(c.v?'-'+c.v:'')+'.webp';
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  /* ================== STORE (shared db, local fallback) ================== */
  let db=null, regs={}, scores={}, tents=[], game={revealed:false}, regsReady=false; const listeners=new Set();
  const LKEY='chalet_local_regs_v2';
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function emit(){listeners.forEach(f=>f())}
  regs=lsGet(LKEY)||{};
  (async()=>{
    try{
      if(window.firebase&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){
        if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
        db=firebase.firestore();
      } else db=null;
    }catch(e){console.error(e);db=null}
    if(!db){regsReady=true;return}
    db.collection('tentatives').onSnapshot(s=>{
      tents=s.docs.map(d=>Object.assign({id:d.id},d.data())); recompute(); emit();
    },()=>{});
    db.doc('etat/partie').onSnapshot(d=>{game=d.exists?d.data():{revealed:false}; emit()},()=>{});
    db.collection('candidats').onSnapshot(s=>{
      const r={}; s.docs.forEach(d=>{const v=d.data(); if(v&&v.secret) r[d.id]=v}); regs=r; regsReady=true; emit();
    },()=>{});
  })();
  async function saveReg(id,data){
    if(db){
      try{await db.doc('candidats/'+id).set(data)}
      catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*600));await db.doc('candidats/'+id).set(data)}else throw e}
    } else { regs[id]=data; lsSet(LKEY,regs); }
    regs[id]=data; emit();
  }
  const TKEY='chalet_local_tents', GKEY='chalet_local_game';
  if(!tents.length){tents=lsGet(TKEY)||[]} game=lsGet(GKEY)||game;
  function recompute(){const sc={}; tents.forEach(v=>{if(v&&v.status==='ok'&&v.from) sc[v.from]=(sc[v.from]||0)+1}); scores=sc}
  recompute();
  async function addTent(d){
    if(db){await db.collection('tentatives').add(d)}
    else{d.id='t'+Date.now();tents=tents.concat([d]);lsSet(TKEY,tents);recompute();emit()}
  }
  async function setTent(id,patch){
    if(db){await db.doc('tentatives/'+id).update(patch)}
    else{tents=tents.map(t=>t.id===id?Object.assign({},t,patch):t);lsSet(TKEY,tents);recompute();emit()}
  }
  async function setGame(v){if(db){await db.doc('etat/partie').set(v)}else{game=v;lsSet(GKEY,v);emit()}}
  function savedCodes(){return lsGet('chalet_codes_v4')||{}}
  function saveCode(id,code){const m=savedCodes(); if(code)m[id]=code; else delete m[id]; lsSet('chalet_codes_v4',m)}
  async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

  /* ================== STAGE / INTRO ================== */
  const app=document.getElementById('app'), stage=document.getElementById('stage'), view=document.getElementById('view');
  const ART_W=941, ART_H=1672;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(devicePixelRatio||1,2);
  const snowB=document.getElementById('snowBack'), snowF=document.getElementById('snowFront');
  const cB=snowB.getContext('2d'), cF=snowF.getContext('2d');
  function fit(){
    const w=innerWidth,h=innerHeight, ar=ART_W/ART_H; let sw,sh;
    if(w/h>0.8){sh=h;sw=h*ar;document.getElementById('backdrop').style.opacity=1}
    else{const s=Math.max(w/ART_W,h/ART_H);sw=ART_W*s;sh=ART_H*s;document.getElementById('backdrop').style.opacity=0}
    stage.style.width=sw+'px';stage.style.height=sh+'px';
    [snowB,snowF].forEach(c=>{c.width=sw*dpr;c.height=sh*dpr});
  }
  const mk=(n,big)=>Array.from({length:n},()=>({x:Math.random(),y:Math.random(),r:big?2+Math.random()*4:.6+Math.random()*1.6,v:big?.0012+Math.random()*.0016:.0004+Math.random()*.0007,s:Math.random()*6.28,a:big?.35+Math.random()*.4:.4+Math.random()*.5}));
  const back=mk(110,false), front=mk(28,true);
  let sparks=[];
  function burst(x=.5,y=.6,n=70){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=.004+Math.random()*.012;sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.7,life:1,r:1+Math.random()*2.5,h:Math.random()<.7?330:220})}}
  function drawFlakes(ctx,arr,big,t){
    const W=ctx.canvas.width,H=ctx.canvas.height; ctx.clearRect(0,0,W,H);
    for(const p of arr){
      p.y+=p.v; p.x+=Math.sin(t*.0006+p.s)*.0004+windX*.0006;
      if(p.y>1.02){p.y=-.02;p.x=Math.random()} if(p.x>1.02)p.x=-.02; if(p.x<-.02)p.x=1.02;
      ctx.beginPath(); ctx.fillStyle=`rgba(255,${big?225:240},${big?240:250},${p.a*snowAlpha})`;
      if(big){ctx.shadowBlur=8*dpr;ctx.shadowColor='rgba(255,90,170,.6)'}else ctx.shadowBlur=0;
      ctx.arc(p.x*W,p.y*H,p.r*dpr,0,6.28); ctx.fill();
    } ctx.shadowBlur=0;
  }
  function drawSparks(ctx){
    const W=ctx.canvas.width,H=ctx.canvas.height; sparks=sparks.filter(s=>s.life>0);
    for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=.00015;s.vx*=.985;s.life-=.016;
      ctx.beginPath();ctx.fillStyle=`hsla(${s.h},100%,80%,${s.life})`;ctx.shadowBlur=10*dpr;ctx.shadowColor=`hsla(${s.h},100%,60%,${s.life})`;
      ctx.arc(s.x*W,s.y*H,s.r*dpr*s.life+.5,0,6.28);ctx.fill()} ctx.shadowBlur=0;
  }
  const st=document.getElementById('stars'), cs=st.getContext('2d');
  const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.3+.3,p:Math.random()*6.28}));
  function drawStars(t){st.width=innerWidth*dpr;st.height=innerHeight*dpr;for(const s of stars){cs.beginPath();cs.fillStyle=`rgba(255,230,245,${.25+.6*Math.abs(Math.sin(t*.0012+s.p))})`;cs.arc(s.x*st.width,s.y*st.height,s.r*dpr,0,6.28);cs.fill()}}
  let tx=0,ty=0,cx=0,cy=0,windX=0,snowAlpha=0;
  function point(x,y){tx=(x/innerWidth-.5)*2;ty=(y/innerHeight-.5)*2}

      body=`<p class="gLead">3 taps et l'app est sur ton écran d'accueil, en plein écran, comme une vraie app.</p>
      <ol class="gSteps">
        <li><span>1</span><p>Appuie sur le bouton <b class="ico">${shareIco}</b> <b>Partager</b>.<small>Dans Safari : en bas de l'écran, au milieu (ou touche d'abord <b class="ico">${dots}</b> à côté de l'adresse). Dans Chrome : en haut, à droite de l'adresse.</small></p></li>
        <li><span>2</span><p>Fais défiler la liste et choisis <b class="ico">${plusIco}</b> <b>« Sur l'écran d'accueil »</b>.<small>Tu ne le vois pas ? Appuie d'abord sur <b>« En voir plus »</b> ou <b>« Modifier les actions »</b>, il est dedans.</small></p></li>
        <li><span>3</span><p>Appuie sur <b>Ajouter</b> en haut à droite.<small>L'icône <b>Le Chalet</b> apparaît sur ton écran d'accueil. Ouvre l'app depuis cette icône.</small></p></li>
      </ol>
      <p class="gNote">Tu as un iPhone avec un iOS ancien et l'option n'apparaît pas ? Ouvre le lien dans <b>Safari</b>, c'est là que ça marche toujours.</p>`;
    } else {
      body=`<button class="btn primary gBig" id="instBtn" type="button">📲 Installe l'app en cliquant ici</button>
      <div class="gFallback" id="gFallback" hidden><p class="gLead">Ton navigateur ne propose pas l'installation en un clic. Pas grave, en 2 taps :</p>
      <ol class="gSteps"><li><span>1</span><p>Ouvre le lien dans <b>Chrome</b>, puis appuie sur <b>⋮</b> en haut à droite</p></li><li><span>2</span><p>Choisis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b></p></li></ol></div>`;
    }
    el.innerHTML=`<div class="gBg"></div><div class="gIn">
      <img class="gEye" src="img/eye.webp" alt="">
      <img class="gLogo" src="img/logo.webp" alt="Le Chalet des Secrets">
      <h1>Installe l'app sur ton téléphone</h1>
      ${body}
      <button class="gSkip" id="gSkip" type="button">Continuer dans le navigateur</button>
    </div>`;
    app.appendChild(el);
    const ib=el.querySelector('#instBtn');
    if(ib)ib.onclick=async()=>{
      if(!deferredPrompt){el.querySelector('#gFallback').hidden=false;ib.hidden=true;return}
      deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; deferredPrompt=null;
      if(r&&r.outcome==='accepted'){el.querySelector('h1').textContent="C'est installé ! Ouvre l'app depuis ton écran d'accueil 🔥";ib.hidden=true}
    };
    el.querySelector('#gSkip').onclick=()=>{try{localStorage.setItem('chalet_skip_install','1')}catch(e){};el.remove();boot()};
  }
})();
</script>

</body></html>
